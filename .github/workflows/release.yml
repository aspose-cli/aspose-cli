name: Signed release artifacts
# A release is built only from a protected version tag (v<Version from Directory.Build.props>),
# however the run was started. Tests, acceptance gates and publication run without signing
# material; only the minimal signing job can reach the release keys.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_protected
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release-build
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Require the tag to name the declared version
        run: |
          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ("v$version" -cne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not name the declared version $version." }
      - name: Provide the test license
        env:
          LICENSE_BASE64: ${{ secrets.ASPOSE_TEST_LICENSE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LICENSE_BASE64)) { throw 'The release-build environment needs the ASPOSE_TEST_LICENSE_BASE64 secret.' }
          $path = Join-Path $env:RUNNER_TEMP 'Aspose.Total.lic'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:LICENSE_BASE64))
          "ASPOSE_CLI_TEST_LICENSE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASPOSE_LICENSE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: ./scripts/test.ps1 -Configuration Release -RequireLicense
      # Known-failing SDK gates block the release unless KNOWN-ISSUES.md waives them for this version.
      - run: ./scripts/acceptance.ps1 -Configuration Release
      - name: Remove the test license
        if: always()
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'Aspose.Total.lic') -Force -ErrorAction SilentlyContinue
      - run: ./scripts/package.ps1 -Configuration Release -RuntimeIdentifier win-x64 -StageOnly
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-aspose-cli-win-x64
          path: artifacts/publish/win-x64/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-verification-evidence
          path: |
            artifacts/TestResults/**/*.trx
            artifacts/acceptance/**/summary.json
          if-no-files-found: warn

  sign:
    needs: build
    # Signing runner prerequisites: Windows x64, Windows PowerShell 5.1, PowerShell 7, OpenSSL 3,
    # signtool.exe, and the code-signing certificate in CurrentUser\My or LocalMachine\My (its key
    # may be HSM-backed). The certificate must be trusted there, including in Trusted Publishers,
    # because the smoke test runs the signed installer with ExecutionPolicy AllSigned.
    runs-on: [self-hosted, Windows, X64, aspose-signing]
    environment: release
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      ASPOSE_CLI_RELEASE_SIGNING_KEY: ${{ vars.ASPOSE_CLI_RELEASE_SIGNING_KEY }}
      ASPOSE_CLI_RELEASE_SIGNING_KEY_PASSPHRASE: ${{ secrets.ASPOSE_CLI_RELEASE_SIGNING_KEY_PASSPHRASE }}
      ASPOSE_CLI_OPENSSL_PATH: ${{ vars.ASPOSE_CLI_OPENSSL_PATH }}
      ASPOSE_CLI_AUTHENTICODE_TOOL: ${{ vars.ASPOSE_CLI_AUTHENTICODE_TOOL }}
      ASPOSE_CLI_AUTHENTICODE_CERTIFICATE_THUMBPRINT: ${{ vars.ASPOSE_CLI_AUTHENTICODE_CERTIFICATE_THUMBPRINT }}
      ASPOSE_CLI_AUTHENTICODE_TIMESTAMP_SERVER: ${{ vars.ASPOSE_CLI_AUTHENTICODE_TIMESTAMP_SERVER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: unsigned-aspose-cli-win-x64
          path: artifacts/publish/win-x64
      # Signs only a payload staged from this same revision; nothing is rebuilt here.
      - run: ./scripts/package.ps1 -RuntimeIdentifier win-x64 -SignStaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-aspose-cli-win-x64
          path: |
            artifacts/release/win-x64/*.zip
            artifacts/release/win-x64/SHA256SUMS
            artifacts/release/win-x64/RELEASE-MANIFEST.json
            artifacts/release/win-x64/RELEASE-MANIFEST.sig
          if-no-files-found: error
