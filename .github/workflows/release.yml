name: Signed release artifacts
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: [self-hosted, Windows, X64, aspose-signing]
    environment: release
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: ./scripts/test.ps1 -Configuration Release
      - run: ./scripts/package.ps1 -Configuration Release -RuntimeIdentifier win-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-aspose-cli-win-x64
          path: |
            artifacts/release/win-x64/*.zip
            artifacts/release/win-x64/SHA256SUMS
            artifacts/release/win-x64/RELEASE-MANIFEST.json
            artifacts/release/win-x64/RELEASE-MANIFEST.sig
          if-no-files-found: error
