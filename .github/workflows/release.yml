name: Release
# A release is built only from a protected version tag (v<Version from Directory.Build.props>),
# however the run was started. It passes every test and acceptance gate, then publishes the
# archive, install.ps1, RELEASE-MANIFEST.json and SHA256SUMS as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_protected
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release-build
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Require the tag to name the declared version
        run: |
          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ("v$version" -cne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not name the declared version $version." }
      - name: Provide the test license
        env:
          LICENSE_BASE64: ${{ secrets.ASPOSE_TEST_LICENSE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LICENSE_BASE64)) { throw 'The release-build environment needs the ASPOSE_TEST_LICENSE_BASE64 secret.' }
          $path = Join-Path $env:RUNNER_TEMP 'Aspose.Total.lic'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:LICENSE_BASE64))
          "ASPOSE_CLI_TEST_LICENSE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Every test with the license, then the acceptance gates: a gate whose SDK defect is fixed,
      # or that cannot run, blocks the release.
      - run: ./scripts/test.ps1 -Configuration Release -Scope Full
      - name: Remove the test license
        if: always()
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'Aspose.Total.lic') -Force -ErrorAction SilentlyContinue
      - run: ./scripts/package.ps1 -Configuration Release -RuntimeIdentifier win-x64
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts/release/win-x64 -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Aspose CLI $($env:GITHUB_REF_NAME.Substring(1))" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-verification-evidence
          path: |
            artifacts/TestResults/**/*.trx
            artifacts/acceptance/**/summary.json
          if-no-files-found: warn
