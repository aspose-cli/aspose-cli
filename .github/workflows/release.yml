name: Release
# A release is built only from a protected version tag, v<Version from Directory.Build.props>,
# that names a commit on master.
# The licensed Full scope runs locally before the tag is pushed, and CI runs the Fast scope on
# every master push; this job requires that run to have passed, packages and checks the release,
# and publishes it as a GitHub release. It does not run the tests again: one runner running every
# test project at once times out tests that pass in CI, where each project has its own runner.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_protected
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the next step can see whether master contains the tagged commit.
          fetch-depth: 0
      - name: Require the tag to name a commit on master
        run: |
          $commit = git rev-parse --verify --quiet "$($env:GITHUB_REF)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME does not name a commit." }
          git merge-base --is-ancestor $commit refs/remotes/origin/master
          if ($LASTEXITCODE -eq 1) { throw "Tag $env:GITHUB_REF_NAME names commit $commit, which is not on master." }
          if ($LASTEXITCODE -ne 0) { throw "Could not check whether master contains commit $commit (git exit code $LASTEXITCODE)." }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Require the tag to name the declared version
        run: |
          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ("v$version" -cne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not name the declared version $version." }
      - name: Require CI on master to have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $commit = git rev-parse "$($env:GITHUB_REF)^{commit}"
          $passed = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&head_sha=$commit" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          if ($LASTEXITCODE -ne 0) { throw "Could not read the CI runs for commit $commit (gh exit code $LASTEXITCODE)." }
          if ([int]$passed -lt 1) { throw "CI on master has not passed on commit $commit; tag a commit whose master CI run is green." }
      - run: ./scripts/package.ps1 -Configuration Release -RuntimeIdentifier win-x64
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts/release/win-x64 -File | ForEach-Object FullName)
          # A pre-release version (v1.1.0-rc.1) never becomes releases/latest, which installed CLIs update from.
          $prerelease = @(if ($env:GITHUB_REF_NAME.Contains('-')) { '--prerelease' })
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Aspose CLI $($env:GITHUB_REF_NAME.Substring(1))" --generate-notes @prerelease
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
