name: Release
# A release is built only from a protected version tag, v<Version from Directory.Build.props>.
# The licensed Full scope runs locally before the tag is pushed (CONTRIBUTING.md); this job runs
# the Fast scope, packages and checks the release, and publishes it as a GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_protected
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Require the tag to name the declared version
        run: |
          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ("v$version" -cne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not name the declared version $version." }
      - run: ./scripts/test.ps1 -Configuration Release -Scope Fast
      - run: ./scripts/package.ps1 -Configuration Release -RuntimeIdentifier win-x64
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts/release/win-x64 -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Aspose CLI $($env:GITHUB_REF_NAME.Substring(1))" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
