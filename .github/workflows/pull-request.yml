name: Pull request
# Checks the branch name, the title and every commit subject against CONTRIBUTING.md, and that a
# new known invariant violation carries the owner's approval. It reruns when the title is edited
# or a label changes, which do not rerun CI.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
jobs:
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the branch name, title and commit subjects
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          types='feat|fix|refactor|perf|test|docs|build|ci|chore|revert'
          scopes='sdk|host|cli|app|cells|pdf|slides|words|skills|install|release|deps'
          subject="^($types)(\(($scopes)\))?: [a-z0-9].*[^.]$"
          dependabot=false
          case "$BRANCH" in dependabot/*) dependabot=true ;; esac
          status=0
          if ! printf '%s' "$BRANCH" | grep -Eq "^(($types|stage)/[a-z0-9]+(-[a-z0-9]+)*|revert-[0-9]+-.+|dependabot/.+)$"; then
            echo "::error::Branch '$BRANCH' must be <type>/<kebab-case-summary> or stage/<kebab-case-summary> (CONTRIBUTING.md#pull-requests)."
            status=1
          fi
          # check NAME TEXT: the conventional form and, except for Dependabot, the length limit.
          check() {
            if ! printf '%s' "$2" | grep -Eq "$subject"; then
              echo "::error::$1 '$2' must be <type>(<scope>): <summary> starting in lower case, without a final period (CONTRIBUTING.md#pull-requests)."
              status=1
            fi
            if [ "${#2}" -gt 85 ] && [ "$dependabot" = false ]; then
              echo "::error::$1 '$2' is ${#2} characters; the limit is 85."
              status=1
            fi
          }
          check Title "$TITLE"
          # Rebase merging keeps every commit, so every subject follows the title's form; a
          # GitHub-generated revert keeps its own subject. A merge of master fails here too.
          subjects=$(git log --format=%s "origin/$GITHUB_BASE_REF..$HEAD")
          while IFS= read -r line; do
            case "$line" in ''|'Revert "'*) continue ;; esac
            check "Commit subject" "$line"
          done <<< "$subjects"
          exit $status
      - name: Require approval to add a known violation
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'quality-exception') }}
        run: |
          file=tests/Aspose.Cli.Invariants.Tests/known-violations.json
          base=$(git merge-base "origin/$GITHUB_BASE_REF" "$HEAD")
          # entries COMMIT OUT: the list at a commit, or an empty one where the file is missing.
          entries() { git show "$1:$file" > "$2" 2>/dev/null || echo '{"violations":[]}' > "$2"; }
          entries "$base" "$RUNNER_TEMP/base.json"
          entries "$HEAD" "$RUNNER_TEMP/head.json"
          # An entry is keyed by its case and invariant. A new key or wider modes (omitted modes
          # mean both) accepts a violation the base did not; removing an entry, narrowing its
          # modes or changing its cause needs no approval. A reworded actual text is shown to the
          # owner as a notice.
          jq -r --slurpfile base "$RUNNER_TEMP/base.json" '
            ($base[0].violations | map({key: "\(.case) / \(.invariant)", value: .actual}) | from_entries) as $was
            | .violations[]
            | "\(.case) / \(.invariant)" as $key
            | select($was[$key] != null and $was[$key] != .actual)
            | "::notice::'"$file"' reworded \($key): \(.actual)"' "$RUNNER_TEMP/head.json"
          widened=$(jq -r --slurpfile base "$RUNNER_TEMP/base.json" '
            ($base[0].violations | map({key: "\(.case) / \(.invariant)", value: .}) | from_entries) as $was
            | .violations[]
            | "\(.case) / \(.invariant)" as $key
            | $was[$key] as $before
            | if $before == null then "added \($key)"
              elif $before.modes != null and (.modes == null or (.modes - $before.modes | length) > 0) then "widened the modes of \($key)"
              else empty end' "$RUNNER_TEMP/head.json")
          if [ -z "$widened" ]; then
            echo "No known violation was added or widened."
            exit 0
          fi
          level=error
          if [ "$APPROVED" = true ]; then
            level=notice
          fi
          while IFS= read -r line; do
            echo "::$level::$file $line"
          done <<< "$widened"
          if [ "$APPROVED" != true ]; then
            echo "::error::Fix the product instead. Accepting a new or wider known violation takes the owner's approval: the 'quality-exception' label on this pull request (AGENTS.md#gates)."
            exit 1
          fi
