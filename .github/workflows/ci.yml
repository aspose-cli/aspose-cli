name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # No license reaches CI: the commercial SDKs run in evaluation mode and the cases that need a
  # license are skipped. The licensed Full scope runs locally before a release (CONTRIBUTING.md).
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: ./scripts/test.ps1 -Configuration Release -Scope Fast
      # Publishes the package and checks it with an install, update and uninstall.
      - run: ./scripts/package.ps1 -Configuration Release -RuntimeIdentifier win-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/TestResults/**/*.trx
            artifacts/TestResults/**/*.log
          if-no-files-found: warn
